<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表单的练习</title>
    <style>
        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 20px;}
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;}
        body {
            padding: 20px;
            font-size: 16px;}
        .box {
            border: 10px solid #ffb8e0;
            padding: 20px;
            max-width: 700px;
            margin: 0 auto;}
        .desc {
            margin-bottom: 25px;
            line-height: 1.6;}
        .desc {
            border: 2px solid #ffb8e0;
            padding:10px;
            margin-bottom:12px;
            line-height: 1.6;}
        .item {
            border: 2px solid #ffb8e0;
            padding:12px;
            margin-bottom:12px;
            line-height: 2;}
        input[type="text"], select, textarea {
            padding: 4px;
            font-size: 16px;}
        textarea {
            width: 100%;
            height: 120px;
            resize: vertical;}
        .btn-wrap {
            text-align: center;
            margin-top: 30px;}
        button,
        input[type="submit"],
        input[type="reset"] {
            padding: 4px 12px;
            margin: 0 6px;}
        .jjy::placeholder {
            font-size:16px;
            color:#333;}
    </style>
</head>
<body>
    <div class="box">
        <h1>图书馆读者调查问卷</h1>
        <p class="desc">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;为了能够及时了解您对图书馆的需求，提升我校图书馆文献资源建设的质量和水平，更好的为我校教学科研服务，我馆特设计了问卷调查题目如下，请协助填写，谢谢您的合作！</p>
        <form action="" method="post">
            <div class="item">
                <p>1. 您的年级</p>
                <span>请你选择：</span>
                <select>
                    <option value="">请你选择</option>
                    <option>大一</option>
                    <option>大二</option>
                    <option>大三</option>
                    <option>大四</option>
                </select>
            </div>

            <div class="item">
                <p>2. 您的专业</p>
                <input type="text" style="width: 350px;">
            </div>

            <div class="item">
                <p>3. 对于图书馆的阅览环境</p>
                <label><input type="radio" name="pj">满意</label><br>
                <label><input type="radio" name="pj">基本满意</label><br>
                <label><input type="radio" name="pj">不满意</label>
                <span>您的建议：</span>
                <input type="text">
            </div>

            <div class="item">
                <p>4. 您到图书馆的原因是（可多选）：</p>
                <label><input type="checkbox">借阅专业图书</label><br>
                <label><input type="checkbox">随便坐坐，翻翻书刊</label><br>
                <label><input type="checkbox">借阅光盘</label><br>
                <label><input type="checkbox">参加图书馆组织的活动</label><br>
                <label><input type="checkbox">自习，复习功课</label><br>
                <label><input type="checkbox">上网</label><br>
                <label><input type="checkbox">检索电子文献</label>
            </div>

            <div class="item">
                <p>5. 您到图书馆的频率</p>
                <label><input type="radio" name="pl">几乎每天</label><br>
                <label><input type="radio" name="pl">每周1-2次</label><br>
                <label><input type="radio" name="pl">每月1-2次</label><br>
                <label><input type="radio" name="pl">几乎不去</label>
            </div>

            <div class="item">
                <p>6. 您对学校的建议</p>
                <textarea placeholder="请您提出宝贵建议：" class="jjy"></textarea>
            </div>

            <div class="btn-wrap">
                <input type="submit" value="提交答案">
                <input type="reset" value="清空">
            </div>
        </form>
    </div>
</body>
</html>
