<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超链接的应用</title>
    <style>
        /*链接伪类：a:link a:visited a:hover a:active*/
        ul li a{
            color: #000;
            text-decoration: none;
        }
        ul li a:link{
            color: #000;
            text-emphasis: none;
        }
        ul li a:visited{
            color: #000;
        }
        ul li a:hover{
            color:red;
            font-weight: bold;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- <a href="http://www.baidu.com">百度</a>
    <a href="http://www.baidu.com">百度</a>
    <a href="http://www.baidu.com">百度</a>
    <a href="http://www.baidu.com">百度</a> -->
    <h2>目录</h2>
    <ul>
    <a href="">早年经历</a>
    <a href="">早年经</a>
    <a href="">早年</a>
    <a href="">早</a>
    </ul>
    <div>
        <h3><a href="">早年经历</a></h3>
    </div>
</body>
</html>
