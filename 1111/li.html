<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>列表</title>
</head>
<body>
    <!-- 无序列表 ul li-->
     <ul>
        <li>计算机科学与技术</li>
        <li>人工智能</li>
        <li>数字媒体</li>
        <li>大数据</li>
     </ul>
    <!-- 列表符号 disc默认 circle square--> 
     <ul type="circle">
        <li type="square">计算机科学与技术</li>
        <li>人工智能</li>
        <li>数字媒体</li>
        <li>大数据</li>
     </ul>
    <!-- 有序列表 ol li-->
     <ol type="A" start="3">
        <h2>班级</h2>
        <li>2026级13班</li>
        <li>2026级14班</li>
        <li>2026级15班</li>
        <li value="1">2026级16班</li>
        <li>2026级17班</li>
        <li>2026级18班</li>
     </ol>
    <!-- 定义列表 dl dt dd-->
     <dl>
        <dt>组长</dt>
        <dd>小明</dd>
        <dd>小绿</dd>
        <dt>组员</dt>
        <dd>小绿</dd>
        <dd>小绿</dd>
        <dd>小绿</dd>
     </dl>
     <!-- 列表嵌套 -->
      
</body>
</html>
